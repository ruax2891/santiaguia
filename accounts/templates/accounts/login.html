{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/estilologin.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
</head>
<body>
    {% include "cabeceraprincipal.html" %}

    <div class="bloque-login">
        <h2>Iniciar Sesión</h2>
        
        {% if form.errors %}
            <p style="color: red;">Tu usuario y contraseña no coinciden. Por favor, inténtalo de nuevo.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="bloque-usuario">
                <label for="id_username">Usuario</label>
                {{ form.username }}
            </div>

            <div class="bloque-password">
                <label for="id_password">Contraseña</label>
                {{ form.password }}
            </div>

            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>
    <script>
        document.getElementById("id_username").placeholder = "Ingresa tu usuario";
        document.getElementById("id_password").placeholder = "Ingresa tu contraseña";
    </script>
</body>
</html>
