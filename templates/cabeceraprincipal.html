<header class="header">
    <nav class="navprincipal">
        <ul class="nav1_list nav0_list">
            <li class="nav1_list_item" id="link_inicio"><a href="{% url 'inicio' %}">SANTIAGUÍA</a></li>
            <li class="nav1_list_item" id="saludo_usuario">Hola, {{user.username}}</li>
        </ul>
        <ul class="nav1_list">
            <li class="nav1_list_item item-cuenta">
                <button type="button" class="boton-cuenta" id="botonCuenta">Cuenta</button>
    
                <ul class="menu-desplegable" id="menuCuenta">
                    <li><a href="{% url 'accounts:login' %}" class="sesion">Iniciar Sesión</a></li>
                    <li><a href="{% url 'accounts:logout' %}" class="sesion">Cerrar Sesión</a></li>
                </ul>
            </li>
            <li class="nav1_list_item"><a href="{% url 'maps:puntosinteres' %}" class="nav_links">Puntos Interes</a></li>
            <li class="nav1_list_item"><a href="{% url 'maps:riesgozonas' %}" class="nav_links">Zonas</a></li>
            <li class="nav1_list_item"><a href="{% url 'forms:index' %}" class="nav_links">Contribuciones</a></li>
            {% if perms.forms.view_respuesta %}
                <li class="nav1_list_item"><a href="{% url 'forms:respuestas' %}" class="nav_links"><b>Respuestas</b></a></li>
            {% endif %}
            <li class="nav1_list_item"><a href="{% url 'wiki:get' '' %}" class="nav_links">Wiki</a></li>
            <li class="nav1_list_item"><a href="" class="nav_links">Acerca de</a></li>
        </ul>
    </nav>
</header>
<script>
    const botonCuenta = document.getElementById("botonCuenta");
    const menuCuenta = document.getElementById("menuCuenta");
    botonCuenta.addEventListener("click", function () {
        menuCuenta.classList.toggle("mostrar");
    });
    window.addEventListener("click", function (evento) {
        if (!botonCuenta.contains(evento.target) && !menuCuenta.contains(evento.target)) {
            menuCuenta.classList.remove("mostrar");
        }
    });
</script>
